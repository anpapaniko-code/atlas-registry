apiVersion: v1
kind: ConfigMap
metadata:
  name: citizen-registry-app-config
  namespace: citizen-registry
  labels:
    app.kubernetes.io/name: citizen-registry-app
    app.kubernetes.io/part-of: citizen-registry-backend
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://citizen-registry-db:3306/citizens_registry
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_H2_CONSOLE_ENABLED: "false"
