services:
  db:
    image: mysql:8.0
    container_name: citizen-registry-db
    restart: unless-stopped
    env_file:
      - ./docker/mysql.env
    volumes:
      - citizen-registry-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uappuser -papppass --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: citizen-registry-service:1.0.1
    container_name: citizen-registry-app
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    env_file:
      - ./docker/app.env
    ports:
      - "8081:8080"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend-net

volumes:
  citizen-registry-db-data:
    name: citizen-registry-db-data

networks:
  backend-net:
    name: citizen-registry-backend-net
