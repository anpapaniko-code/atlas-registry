apiVersion: apps/v1
kind: Deployment
metadata:
  name: citizen-registry-app
  namespace: citizen-registry
  labels:
    app.kubernetes.io/name: citizen-registry-app
    app.kubernetes.io/component: rest-api
    app.kubernetes.io/part-of: citizen-registry-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: citizen-registry-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: citizen-registry-app
        app.kubernetes.io/component: rest-api
        app.kubernetes.io/part-of: citizen-registry-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: citizen-registry-app
          image: citizen-registry-service:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: citizen-registry-app-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: citizen-registry-db-secret
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: citizen-registry-db-secret
                  key: MYSQL_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
