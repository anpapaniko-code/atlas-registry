name: Citizen Registry CI

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:

  ################################
  # BUILD
  ################################
  build:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile project
        run: mvn -B -ntp clean compile


  ################################
  # TEST
  ################################
  test:
    name: Test & Package
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit and integration/API tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: executable-jar
          path: citizen-registry-service/target/*.jar
          if-no-files-found: error
          retention-days: 7


  ################################
  # RELEASE
  ################################
  release:
    name: Publish Early Release
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download executable JAR
        uses: actions/download-artifact@v4
        with:
          name: executable-jar
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: early-release-${{ github.run_number }}
          name: Early Release ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release-files/*.jar